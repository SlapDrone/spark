---
- name: Install tmux
  pacman:
    name: tmux
    state: present

- name: Install fzf
  pacman:
    name: fzf
    state: present

- name: Install bat
  pacman:
    name: bat
    state: present

- name: Install zoxide
  pacman:
    name: zoxide
    state: present

- name: Install tmux plugin manager (tpm)
  aur:
    name:
      - tmux-plugin-manager
    user: "{{ user.name }}"
  tags:
    - aur

- name: Add appropriate line to tmux conf
  become: false
  ansible.builtin.lineinfile:
    path: "/home/{{ user.name }}/.tmux.conf"
    line: run '/usr/share/tmux-plugin-manager/tpm'
    create: yes
    state: present
    insertafter: EOF
